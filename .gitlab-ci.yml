stages:
  - lint
  - test

# Use a standard Python image
image: python:3.12-slim

# Install system dependencies (like ffmpeg and tk requirements)
before_script:
  - apt-get update && apt-get install -y ffmpeg libtk8.6
  - pip install -r requirements.txt

# Linting stage to keep code clean
lint:
  stage: lint
  script:
    - pip install flake8
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

# Basic test stage
# Note: Since this is a GUI app, we skip tests that require a display (X11)
test:
  stage: test
  script:
    - python -c "import Application; print('Import successful')"
    - python -c "import FrameClasses; print('FrameClasses import successful')"
    - python -c "import Caper; print('Caper import successful')"

# The measurement itself lives in the GUI-free `capillary` package, so it can be
# tested properly: these run against synthetic videos with a known velocity.
unit-tests:
  stage: test
  script:
    - pip install pytest
    - python -m pytest
